services:
  - type: web
    name: lotushaven-backend
    env: docker
    region: singapore
    plan: free
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
