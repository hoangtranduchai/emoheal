name: emoheal
description: Flutter onboarding screen inspired by Figma design.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  path_provider: ^2.1.6
  record: ^5.2.0
  supabase_flutter: ^2.17.1
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  pinput: ^5.0.0
  shared_preferences: ^2.3.2
  flutter_contacts: ^2.3.1




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_android: 2.2.23
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/videos/
    - assets/images/
    - assets/icons/
    - assets/store/
    - assets/fonts/
    - assets/google_fonts/
    - google_fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F7F5F0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#F7F5F0"
    theme_color: "#3C7232"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48


