name: lotus_haven
description: Flutter onboarding screen inspired by Figma design.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  supabase_flutter: ^2.17.1
  url_launcher: ^6.3.2
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
    - assets/icons/